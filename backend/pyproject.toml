[project]
name = "arbitro"
version = "0.1.0"
description = "LLM output arbitration — agreement, escalation and arbitration accuracy"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arbitro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
